// Typed requests: the parameters of the primitives warden-executor can run.
//
// Source of truth: warden/specs/typed-action-catalog.md §4.1 and §4.4.
// Requests hold only scalars, enums and repeated scalars (R3, R3a): no
// message-typed field, so no request can be nested or recursive. Value
// limits are enforced by each primitive's validator, not by this file.
// Field numbers are part of the signed wire format. Never renumber or reuse
// one.

syntax = "proto3";

package warden.v1;

option go_package = "github.com/nofal82/warden-agent/api/proto/warden/v1;wardenv1";

// TypedRequest is EnvelopeBody field 8 (`params`). Exactly one member is set.
// Member numbers equal the primitive numbers P1–P22 of the catalog.
message TypedRequest {
  // P20 (cert.renew) was removed from the catalog; its number is never
  // reused.
  reserved 20;
  reserved "cert_renew";

  oneof request {
    FsUsageRequest fs_usage = 1;
    FsLargestEntriesRequest fs_largest_entries = 2;
    ServiceStatusRequest service_status = 3;
    WebConfigTestRequest web_config_test = 4;
    CertInspectRequest cert_inspect = 5;
    ProcessTopRequest process_top = 6;
    MemStatusRequest mem_status = 7;
    ContainerInspectRequest container_inspect = 8;
    DbQueryReadonlyRequest db_query_readonly = 9;
    DbBackupVerifyRequest db_backup_verify = 10;
    ServiceRestartRequest service_restart = 11;
    ServiceResetFailedRequest service_reset_failed = 12;
    ServiceReloadRequest service_reload = 13;
    ServiceStartRequest service_start = 14;
    ServiceSetCpuQuotaRequest service_set_cpu_quota = 15;
    ProcessSignalRequest process_signal = 16;
    FileDeleteByAgeRequest file_delete_by_age = 17;
    JournalVacuumRequest journal_vacuum = 18;
    PkgCacheCleanRequest pkg_cache_clean = 19;
    ContainerRestartRequest container_restart = 21;
    DbTerminateSessionRequest db_terminate_session = 22;
  }
}

// Common enums (§4.1). Every *_UNSPECIFIED value is invalid.

enum Engine {
  ENGINE_UNSPECIFIED = 0;
  // MySQL and MariaDB.
  ENGINE_MYSQL = 1;
  ENGINE_POSTGRESQL = 2;
  ENGINE_MONGODB = 3;
}

enum WebServer {
  WEB_SERVER_UNSPECIFIED = 0;
  WEB_SERVER_NGINX = 1;
  WEB_SERVER_APACHE = 2;
}

enum Signal {
  SIGNAL_UNSPECIFIED = 0;
  SIGNAL_TERM = 1;
  SIGNAL_KILL = 2;
}

// P1 fs.usage (read).
message FsUsageRequest {
  // Absolute path of a mount point.
  string mount_path = 1;
}

// P2 fs.largest_entries (read).
message FsLargestEntriesRequest {
  // Absolute directory path.
  string path = 1;
  // 1 … 4.
  uint32 max_depth = 2;
  // 1 … 50.
  uint32 top_n = 3;
  // 0 … 2^50.
  uint64 min_size_bytes = 4;
  // 0 … 31,536,000; 0 means no age filter.
  uint32 modified_within_seconds = 5;
}

// P3 service.status (read).
message ServiceStatusRequest {
  // systemd service unit.
  string unit = 1;
}

// P4 web.config_test (read).
message WebConfigTestRequest {
  WebServer server = 1;
}

// P5 cert.inspect (read).
message CertInspectRequest {
  // Absolute path to a PEM file.
  string path = 1;
}

// Sort order for P6 process.top.
enum ProcessOrder {
  PROCESS_ORDER_UNSPECIFIED = 0;
  PROCESS_ORDER_CPU = 1;
  PROCESS_ORDER_MEMORY = 2;
}

// P6 process.top (read).
message ProcessTopRequest {
  ProcessOrder order_by = 1;
  // 1 … 50.
  uint32 top_n = 2;
  // 200 … 5000; ignored for PROCESS_ORDER_MEMORY.
  uint32 sample_ms = 3;
}

// P7 mem.status (read). No fields.
message MemStatusRequest {}

// P8 container.inspect (read).
message ContainerInspectRequest {
  // Exact full container name or full 64-character id.
  string container = 1;
}

// Fixed queries for P9 db.query_readonly. Statement text lives in the
// warden-dbhelper adapter, never in a request.
enum DbQuery {
  DB_QUERY_UNSPECIFIED = 0;
  DB_QUERY_SERVER_STATUS = 1;
  DB_QUERY_CONNECTIONS_SUMMARY = 2;
  DB_QUERY_SESSIONS_TOP_IDLE = 3;
  DB_QUERY_REPLICATION_STATUS = 4;
  DB_QUERY_REPLSET_STATUS = 5;
}

// P9 db.query_readonly (read).
message DbQueryReadonlyRequest {
  Engine engine = 1;
  // Database instance: the systemd service unit of the database server.
  string instance = 2;
  DbQuery query = 3;
  // 1 … 100; only for list queries.
  uint32 limit = 4;
}

// P10 db.backup_verify (read).
message DbBackupVerifyRequest {
  Engine engine = 1;
  // Database instance: the systemd service unit of the database server.
  string instance = 2;
  // 1 … 16: index into the backup locations declared for this server.
  uint32 backup_location_id = 3;
  // 1 … 720.
  uint32 max_age_hours = 4;
  // 1 … 2^50.
  uint64 min_size_bytes = 5;
}

// P11 service.restart (act).
message ServiceRestartRequest {
  string unit = 1;
}

// P12 service.reset_failed (act).
message ServiceResetFailedRequest {
  string unit = 1;
}

// P13 service.reload (act).
message ServiceReloadRequest {
  string unit = 1;
}

// P14 service.start (act).
message ServiceStartRequest {
  string unit = 1;
}

// P15 service.set_cpu_quota (act).
message ServiceSetCpuQuotaRequest {
  string unit = 1;
  // 10 … 100 × online CPUs, or 0 to remove the limit.
  uint32 cpu_quota_percent = 2;
  // 0 or 2 … 4,194,304.
  uint32 pid = 3;
  // 0 or 1 … 2^62; zero together with pid.
  uint64 start_time_ticks = 4;
}

// P16 process.signal (act).
message ProcessSignalRequest {
  // 2 … 4,194,304.
  uint32 pid = 1;
  // 1 … 2^62.
  uint64 start_time_ticks = 2;
  Signal signal = 3;
}

// Housekeeping roots for P17 file.delete_by_age. There is no path in the
// request.
enum FileDeleteRoot {
  FILE_DELETE_ROOT_UNSPECIFIED = 0;
  FILE_DELETE_ROOT_VAR_LOG_ROTATED = 1;
  FILE_DELETE_ROOT_CORE_DUMPS = 2;
}

// P17 file.delete_by_age (act).
message FileDeleteByAgeRequest {
  FileDeleteRoot root = 1;
  // 7 … 365.
  uint32 min_age_days = 2;
  // 1 … 10,000.
  uint32 max_files = 3;
  // 1 … 2^44.
  uint64 max_bytes = 4;
  bool dry_run = 5;
}

// P18 journal.vacuum (act).
message JournalVacuumRequest {
  // 7 … 365.
  uint32 keep_days = 1;
}

// P19 pkg.cache_clean (act). No fields.
message PkgCacheCleanRequest {}

// P21 container.restart (act).
message ContainerRestartRequest {
  // Exact full container name or full 64-character id.
  string container = 1;
  // 1 … 120.
  uint32 stop_timeout_seconds = 2;
}

// P22 db.terminate_session (act).
message DbTerminateSessionRequest {
  Engine engine = 1;
  // Database instance: the systemd service unit of the database server.
  string instance = 2;
  // 1 … 20 entries, no duplicates.
  repeated uint64 session_ids = 3;
  // Same count and order as session_ids. PostgreSQL: backend_start in
  // microseconds since the Unix epoch; MySQL/MariaDB: each 0.
  repeated int64 session_started_at = 4;
  // MySQL/MariaDB: 1 … 2^40 − 1; PostgreSQL: 0.
  int64 server_started_at = 5;
  // MySQL/MariaDB: same count and order as session_ids, each exactly 32
  // bytes; PostgreSQL: empty.
  repeated bytes session_owner_digests = 6;
  // 60 … 86,400.
  uint32 min_idle_seconds = 7;
}
